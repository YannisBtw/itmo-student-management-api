<!DOCTYPE html> <!-- Сообщает браузеру: Это современный HTML5-документ. -->
<html lang="ru"> <!-- Это корневой элемент страницы. -->

<head> <!-- содержит служебную информацию о странице. -->
    <meta charset="UTF-8"> <!-- указывает кодировку. -->
    <title>Управление студентами</title>
    <link rel="stylesheet" href="/static/css/style.css"> <!-- подключение style.css. -->
    <link rel="icon" href="/static/favicon.ico">
</head>

<body> <!-- пользователь непосредственно видит на странице. -->

<header class="page-header">  <!-- универсальный контейнер. -->
    <h1>Управление студентами</h1>  <!-- heading level 1 - главный заголовок страницы. -->

    <a href="student-form.html" class="add-button"> <!-- anchor (ссылка). -->
        Добавить студента
    </a>
</header>

<main>
    <section class="filters">
        <div class="filter-field">
            <label for="filterGroup">Группа</label>
            <input
                    type="text"
                    id="filterGroup"
                    placeholder="Например, P3120"
                    pattern="[A-Z][1-9][1-4][0-9]{2}"
            >
        </div>

        <div class="filter-field">
            <label for="filterDormitory">Общежитие</label>
            <input
                    type="number"
                    id="filterDormitory"
                    min="1"
                    max="99"
            >
        </div>

        <div class="filter-field">
            <label for="filterIsForeign">Иностранный студент</label>

            <select id="filterIsForeign">
                <option value="">Все</option>
                <option value="true">Да</option>
                <option value="false">Нет</option>
            </select>
        </div>

        <div class="filter-actions">
            <button type="button" id="applyFilters">
                Найти
            </button>

            <button type="button" id="resetFilters">
                Сбросить
            </button>
        </div>
    </section>
    <div class="table-wrapper">
        <table id="studentsTable"> <!-- контейнер всей таблицы. -->
            <thead> <!-- table head (шапка таблицы) -->
            <tr> <!-- table row (строка таблицы). -->
                <th>ФИО</th> <!-- table header (ячейка-заголовок.) -->
                <th>Группа</th>
                <th>ИСУ ID</th>
                <th>Общежитие</th>
                <th>Комната</th>
                <th>Дата заселения</th>
                <th>Действия</th>
            </tr>
            </thead>

            <tbody id="studentsTableBody"> <!-- table body (основное содержимое таблицы). -->
            </tbody>
        </table>
    </div>
</main>

<script src="/static/js/db.js"></script> <!-- подключение db.js. -->
<script src="/static/js/students.js"></script> <!-- подключение students.js. -->

</body>
</html>
